name: Build Nuke Wireless Info extension

on:
  push:
    branches:
      - main
    paths:
      - src/NukeWirelessInfo.m
      - src/NWScanBridge.m
      - src/NWScanBridge.h
      - src/NWRefreshThunk.S
      - .github/workflows/build-info.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Nuke Wireless extension for iOS arm64
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=16.3 \
            -isysroot "$sdk" -fobjc-arc -fblocks -fPIC -O2 \
            -dynamiclib -Wl,-undefined,dynamic_lookup \
            -framework UIKit -framework Foundation \
            -framework QuartzCore -framework SystemConfiguration \
            -o prebuilt/NukeWirelessInfo_ios.dylib \
            src/NukeWirelessInfo.m src/NWScanBridge.m src/NWRefreshThunk.S
          file prebuilt/NukeWirelessInfo_ios.dylib
      - name: Save compiled Info library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebuilt/NukeWirelessInfo_ios.dylib
          if ! git diff --cached --quiet; then
            git commit -m "Build Nuke Wireless Info-only library"
            git push origin HEAD:main
          fi
