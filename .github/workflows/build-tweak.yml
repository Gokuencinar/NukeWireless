name: Build Nuke Wireless

on:
  push:
    branches:
      - nuke-wireless
    paths:
      - src/NukeWirelessPaths.c
      - .github/workflows/build-tweak.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile iOS arm64 library
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=16.3 \
            -isysroot "$sdk" -fPIC -fblocks -O2 \
            -dynamiclib -Wl,-undefined,dynamic_lookup \
            -o prebuilt/NukeWirelessPaths_ios.dylib \
            src/NukeWirelessPaths.c
          file prebuilt/NukeWirelessPaths_ios.dylib
      - name: Save compiled library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebuilt/NukeWirelessPaths_ios.dylib
          if ! git diff --cached --quiet; then
            git commit -m "Build Nuke Wireless iOS arm64 library"
            git push origin HEAD:nuke-wireless
          fi
