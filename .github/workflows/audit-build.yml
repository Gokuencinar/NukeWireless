name: Development build
on:
  push:
    branches: [audit-rh25.5]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests and iOS compile
        run: bash scripts/build_extension.sh
      - name: SwiftUI tab navigation regression
        run: bash scripts/test_ui_simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuke-wireless-development
          path: |
            build/audit/NukeWirelessInfo_ios.dylib
            build/audit/nw-hotspot
            build/audit/build-manifest.json
            build/audit/NukeLaunch.storyboardc/
            build/audit/NWBootPic.png
            build/ui/*.png
            build/ui/*.json
            build/ui/*.ips
          retention-days: 7
