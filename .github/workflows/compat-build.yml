name: iOS 15-18 compatibility candidates
on:
  push:
    branches: [audit-rh25.5]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'scripts/build_extension.sh'
      - 'scripts/build_manifest.py'
      - 'scripts/startup_resources.py'
      - 'scripts/build_compat*'
      - 'scripts/compat_*'
      - 'scripts/install_layout.py'
      - 'scripts/build_bluetooth_inspector.sh'
      - 'scripts/bluetooth_manifest.py'
      - 'scripts/build_bluetooth_deb.py'
      - 'scripts/test_ui_simulator.sh'
      - 'tests/**'
      - '.github/workflows/compat-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile current app, adapter and guarded Bluetooth worker for iOS 15
        run: bash scripts/build_compat.sh
      - name: Navigation and background regression with iOS 15 deployment target
        run: NW_MIN_IOS=15.0 bash scripts/test_ui_simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuke-wireless-compatibility
          path: |
            build/audit/NukeWirelessInfo_ios.dylib
            build/audit/nw-hotspot
            build/audit/NukeWirelessPaths_ios.dylib
            build/audit/build-manifest.json
            build/audit/compat-manifest.json
            build/audit/NukeLaunch.storyboardc/
            build/audit/NWBootPic.png
            build/bluetooth/NukeBluetoothBridge.dylib
            build/bluetooth/nwbt-run
            build/bluetooth/nwbt-inspect
            build/bluetooth/bluetooth-manifest.json
            build/ui/*.png
            build/ui/*.json
            build/ui/*.ips
          retention-days: 14
